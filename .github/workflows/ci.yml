name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.distribution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - distribution: Ubuntu 24.04 (Emacs 29)
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y emacs-nox git ca-certificates gnupg build-essential curl
          - distribution: Fedora 45 (stock Emacs)
            image: fedora:45
            install: dnf install -y emacs-nox git ca-certificates gnupg2 gcc gcc-c++ make curl-minimal
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install distribution packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test fresh installation and first use
        run: CI_TEST_ROOT="$RUNNER_TEMP/emacs-ci" bash tests/run-ci.sh
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ strategy.job-index }}-linux
          path: |
            ${{ runner.temp }}/emacs-ci/logs/
            ${{ runner.temp }}/emacs-ci/config/bootstrap-errors.log
            ${{ runner.temp }}/emacs-ci/config/bootstrap-status.el
          if-no-files-found: ignore

  macos:
    name: macOS (Homebrew Emacs)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Homebrew packages
        run: brew install emacs gnupg
      - name: Test fresh installation and first use
        run: CI_TEST_ROOT="$RUNNER_TEMP/emacs-ci" bash tests/run-ci.sh
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-macos
          path: |
            ${{ runner.temp }}/emacs-ci/logs/
            ${{ runner.temp }}/emacs-ci/config/bootstrap-errors.log
            ${{ runner.temp }}/emacs-ci/config/bootstrap-status.el
          if-no-files-found: ignore

  validate:
    name: validate
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: test "$LINUX_RESULT" = success && test "$MACOS_RESULT" = success
